name: Continuous Integration

on: [push, pull_request]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest

    steps:

    - name: Checkout the Git repository
      uses: actions/checkout@v4

    - name: Build application
      run: |
        sh .devcontainer/install-dependencies.sh
        /opt/devkitpro/portlibs/wii/bin/powerpc-eabi-cmake -B $GITHUB_WORKSPACE/build_wii -G Ninja
        cmake --build $GITHUB_WORKSPACE/build_wii --verbose
        /opt/devkitpro/portlibs/gamecube/bin/powerpc-eabi-cmake -B $GITHUB_WORKSPACE/build_gc -G Ninja
        cmake --build $GITHUB_WORKSPACE/build_gc --verbose

    - name: Prepare artifact
      run: |
        mkdir --parents artifact/MiisendU-Wii
        mv --verbose build_wii/MiisendU-Wii.dol artifact/MiisendU-Wii/boot.dol
        cp --verbose meta/* artifact/MiisendU-Wii

    - uses: actions/upload-artifact@v4
      with:
        name: MiisendU-Wii
        path: artifact/
